name: CI

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows-desktop:
    name: Windows native desktop
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
      - name: Run native core regressions
        run: dotnet run --project native/desktop/Recappi.Core.Tests -c Release
      - name: Build WPF interaction tests
        # Actual interactive runs remain a desktop-session validation gate.
        run: dotnet build native/desktop/Recappi.Desktop.Tests -c Release
      - name: Publish and verify both native architectures
        run: ./scripts/publish-native-desktop.ps1
      - name: Build runtime prerequisite probes
        run: |
          foreach ($runtime in @('win-x64', 'win-arm64')) {
            dotnet publish native/desktop/Recappi.RuntimeProbe/Recappi.RuntimeProbe.csproj -c Release -r $runtime --self-contained false -p:RestoreLockedMode=true -o "build/runtime-probe/$runtime"
            if ($LASTEXITCODE -ne 0) { throw "Runtime probe build failed: $runtime" }
          }
          & ./build/runtime-probe/win-x64/Recappi.RuntimeProbe.exe --check-runtime
          if ($LASTEXITCODE -ne 0) { throw 'Installed runtime probe failed.' }
      - uses: actions/upload-artifact@v7
        with:
          name: windows-native-preview
          path: |
            build/native-desktop-release/**/*.zip
            build/native-desktop-release/**/release-report.json
          if-no-files-found: error
          retention-days: 7

  windows-cli:
    name: Windows CLI
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
      - uses: pnpm/action-setup@v5
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - run: npm install -g vite-plus@0.2.1
      - run: pnpm install --frozen-lockfile
      - run: ./scripts/build-windows-cli-helper.ps1
      - run: pnpm --filter recappi check
      - run: pnpm --filter recappi pack:check
      - run: node cli/recappi/scripts/check-windows-install.mjs
      - run: node ../check-helper-pack.mjs RecappiAudioCapture.exe
        working-directory: cli/helpers/win32-x64

  tests:
    name: Swift tests
    runs-on: macos-26
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Run tests
        run: swift test --force-resolved-versions
